name: Check and release

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  version:
    name: Resolve GitVersion package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate GitVersion 6.8.2
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install GitVersion.Tool --tool-path "$RUNNER_TEMP/gitversion" --version 6.8.2
          version="$("$RUNNER_TEMP/gitversion/dotnet-gitversion" /showvariable MajorMinorPatch)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  check:
    needs: version
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend and build
        working-directory: frontend
        shell: bash
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build
      - name: Test IntelliSense core
        run: npm test
      - name: Install Python test dependencies
        run: python -m pip install pytest ruff==0.17.3
      - name: Check Python and package
        shell: bash
        run: |
          python -m compileall -q Paramood scripts tests
          python -m ruff check Paramood scripts tests
          python -m ruff format --check Paramood scripts tests
          python -m pytest -q
          python scripts/build_release.py --version "${{ needs.version.outputs.version }}"
      - name: Upload release package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paramood-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Paramood-frontend
          path: frontend/dist
      - name: Calculate version and build package
        id: version
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ ! -s "docs/releases/$version.md" ]]; then
            echo "No reviewed notes for $version: skip publication; CI remains green."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          python scripts/build_release.py --version "$version"
          (cd dist && sha256sum -c "Paramood-$version.zip.sha256")
          python scripts/release_contract.py \
            --version "$version" --tag "v$version" --channel stable \
            --manifest Paramood/Paramood.manifest \
            --archive "dist/Paramood-$version.zip" --notes "docs/releases/$version.md"
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_COMMIT" || { echo "Tag $tag belongs to another commit" >&2; exit 1; }
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists"
              exit 0
            fi
            verify_tag=(--verify-tag)
          else
            verify_tag=()
          fi
          notes=(--notes-file "docs/releases/$RELEASE_VERSION.md")
          gh release create "$tag" "dist/Paramood-$RELEASE_VERSION.zip" "dist/Paramood-$RELEASE_VERSION.zip.sha256" \
            "${verify_tag[@]}" --target "$RELEASE_COMMIT" --title "Paramood $RELEASE_VERSION" "${notes[@]}"
