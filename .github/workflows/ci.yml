name: Check and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend and build
        working-directory: frontend
        shell: bash
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run build
      - name: Install Python test dependencies
        run: python -m pip install pytest ruff
      - name: Check Python and package
        shell: bash
        run: |
          python -m compileall -q ParaMod scripts tests
          python -m ruff check ParaMod scripts tests
          python -m pytest -q
          python scripts/build_release.py
      - name: Upload release package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paramood-package
          path: dist/Paramood-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Paramood-package
          path: dist
      - name: Verify tag, checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('ParaMod/ParaMod.manifest'))['version'])")
          test "$RELEASE_TAG" = "v$version"
          cd dist
          sha256sum -c "Paramood-$version.zip.sha256"
          cd ..
          gh release create "$RELEASE_TAG" "dist/Paramood-$version.zip" "dist/Paramood-$version.zip.sha256" --verify-tag --title "Paramood $version — Stable" --notes-file "docs/releases/$version.md"
