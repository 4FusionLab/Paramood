<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paramood — Variants preview</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const parameters = [
        ['box_width', '120 mm'],
        ['box_height', '80 mm'],
        ['box_depth', '60 mm'],
        ['wall_thickness', '3 mm'],
        ['lid_clearance', '0.3 mm'],
        ['corner_radius', '5 mm'],
        ['hole_diameter', '4 mm'],
        ['hole_count', '4'],
      ].map(([name, expression]) => ({
        name,
        expression,
        value: expression,
        unit: name === 'hole_count' ? '' : 'mm',
        kind: 'user',
        entityToken: name,
        favorite: false,
        bindings: [],
      }));
      const model = {
        documentId: 'preview',
        documentName: 'Enclosure v12',
        defaultLengthUnit: 'mm',
        parameters,
        variantTableVersion: 2,
        variantColumns: [
          ...parameters.slice(0, 2).map((p) => ({
            kind: 'parameter',
            name: p.name,
            entityToken: p.entityToken,
            unit: p.unit,
          })),
          { kind: 'feature', name: 'Lid cut', entityToken: 'lid-cut' },
        ],
        timelineFeatures: [{ name: 'Lid cut', entityToken: 'lid-cut', enabled: true }],
        variants: ['Classic', 'Compact', 'Garden'].map((name, index) => ({
          id: String(index),
          name,
          parameters: parameters
            .slice(0, 2)
            .map((p) => ({ ...p, value: 12, expression: index ? '90 mm' : p.expression })),
          features: [{ name: 'Lid cut', entityToken: 'lid-cut', enabled: index !== 1 }],
        })),
        activeVariantId: null,
        variantsToken: 'storage',
        variantSnapshotToken: 'snapshot',
        unitsSnapshotToken: 'units-snapshot',
      };
      if (new URLSearchParams(location.search).has('many')) {
        model.variants = Array.from({ length: 30 }, (_, index) => ({
          id: String(index),
          name: `Size ${index + 1}`,
          parameters: [
            {
              name: 'box_width',
              entityToken: 'box_width',
              expression: `${90 + index} mm`,
              unit: 'mm',
              value: (90 + index) / 10,
            },
            { ...parameters[1], value: 8 },
          ],
          features: [{ name: 'Lid cut', entityToken: 'lid-cut', enabled: true }],
        }));
      }
      window.adsk = {
        fusionSendData(action, raw) {
          const r = JSON.parse(raw);
          let data = {};
          const p = r.payload;
          if (r.action === 'state.get') {
            parameters.forEach(
              (p) =>
                (p.configured = model.variantColumns.some(
                  (c) => c.kind === 'parameter' && c.name === p.name,
                )),
            );
            data = structuredClone(model);
          }
          if (r.action === 'variants.selection.get')
            data = { documentId: model.documentId, features: [] };
          if (r.action === 'variants.cell.preview') {
            // This browser-only fixture preserves syntax; Fusion performs real validation.
            let parts = [],
              part = '',
              depth = 0,
              quote = '',
              escaped = false;
            for (const character of p.text) {
              if (quote) {
                part += character;
                if (escaped) escaped = false;
                else if (character === '\\') escaped = true;
                else if (character === quote) quote = '';
                continue;
              }
              if (character === "'" || character === '"') {
                quote = character;
                part += character;
              } else if (character === '(') {
                depth++;
                part += character;
              } else if (character === ')') {
                depth--;
                part += character;
              } else if (character === ';' && depth === 0) {
                parts.push(part);
                part = '';
              } else part += character;
            }
            parts.push(part);
            const definitions = parts.map((text) => {
              const at = text.indexOf('=');
              return {
                name: text.slice(0, at).trim().replaceAll('.', '_'),
                expression: text.slice(at + 1).trim(),
              };
            });
            const target = definitions.find((x) => x.name === p.target);
            data = {
              expression:
                target?.expression ||
                p.parameters.find((x) => x.name === p.target)?.expression ||
                '',
              newParameters: definitions
                .filter((x) => x.name !== p.target)
                .map((x) => ({
                  ...x,
                  unit: parameters.find((x) => x.name === p.target)?.unit || 'mm',
                  value: x.expression,
                })),
            };
          }
          if (r.action === 'document.units') model.defaultLengthUnit = p.unit;
          if (r.action === 'calculator.evaluate') {
            const arithmetic = p.expression
              .trim()
              .match(/^([+-]?[0-9.]+)\s*([+*/-])\s*([+-]?[0-9.]+)$/);
            let value = Number(p.expression);
            if (arithmetic) {
              const a = Number(arithmetic[1]),
                b = Number(arithmetic[3]);
              value =
                arithmetic[2] === '+'
                  ? a + b
                  : arithmetic[2] === '-'
                    ? a - b
                    : arithmetic[2] === '*'
                      ? a * b
                      : a / b;
            }
            data = {
              value,
              formatted: Number.isFinite(value)
                ? String(value)
                : 'Preview supports simple arithmetic',
              unit: '',
            };
          }
          if (r.action === 'parameters.preview') {
            const items = p.text
              .split(';')
              .filter(Boolean)
              .map((definition) => {
                const [rawName, expression] = definition.split('=');
                const name = rawName.trim().replaceAll('.', '_');
                const existing = parameters.find((parameter) => parameter.name === name);
                return {
                  name,
                  expression: expression?.trim() || '',
                  value: expression?.trim() || '',
                  unit: existing?.unit || model.defaultLengthUnit,
                  status: existing ? 'Update' : 'New',
                };
              });
            data = {
              snapshotToken: 'preview',
              valid: items.length > 0 && items.every((item) => !!item.expression),
              items,
            };
          }
          if (r.action === 'parameters.apply') {
            p.text
              .split(';')
              .filter(Boolean)
              .forEach((definition) => {
                const [rawName, expression] = definition.split('=');
                const name = rawName.trim().replaceAll('.', '_');
                let parameter = parameters.find((item) => item.name === name);
                if (!parameter) {
                  parameter = {
                    name,
                    entityToken: name,
                    expression,
                    unit: model.defaultLengthUnit,
                    value: expression,
                    kind: 'user',
                    favorite: false,
                  };
                  parameters.push(parameter);
                }
                parameter.expression = expression.trim();
                parameter.value = expression.trim();
                const active = model.variants.find(
                  (variant) => variant.id === model.activeVariantId,
                );
                if (active) {
                  const entry = { ...parameter };
                  const index = active.parameters.findIndex((item) => item.name === name);
                  if (index >= 0) active.parameters[index] = entry;
                }
              });
          }

          if (r.action === 'variants.table.save') {
            (p.newParameters || []).forEach((entry) =>
              parameters.push({
                ...entry,
                entityToken: entry.name,
                kind: 'user',
                favorite: false,
                configured: false,
                value: entry.expression,
              }),
            );
            model.variantColumns = structuredClone(p.columns);
            model.variants = structuredClone(p.variants).map((v) => ({
              ...v,
              id: v.id || crypto.randomUUID(),
            }));
            const active = model.variants.find((v) => v.id === model.activeVariantId);
            if (active) {
              active.parameters.forEach((e) => {
                const p = parameters.find((x) => x.name === e.name);
                p.expression = e.expression;
                p.value = e.expression;
              });
              (active.features || []).forEach((f) => {
                model.timelineFeatures.find((x) => x.entityToken === f.entityToken).enabled =
                  f.enabled;
              });
            }
            if (model.activeVariantId && !active) model.activeVariantId = null;
          }
          if (r.action === 'variants.free') model.activeVariantId = null;
          if (r.action === 'variants.apply') {
            const v = model.variants.find((x) => x.id === p.id);
            model.activeVariantId = v.id;
            (v.features || []).forEach((f) => {
              model.timelineFeatures.find((x) => x.entityToken === f.entityToken).enabled =
                f.enabled;
            });
            v.parameters.forEach((e) => {
              let a = parameters.find((x) => x.name === e.name);
              a.expression = e.expression;
              a.value = e.expression;
            });
          }
          if (r.action === 'variants.delete') {
            model.variants = model.variants.filter((x) => x.id !== p.id);
            if (model.activeVariantId === p.id) model.activeVariantId = null;
          }
          window.fusionJavaScriptHandler.handle(
            'response',
            JSON.stringify({
              requestId: r.requestId,
              ok: true,
              documentId: model.documentId,
              data,
            }),
          );
        },
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
