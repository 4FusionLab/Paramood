<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Paramood — Keeper of Measure</title>
  <desc id="desc">An ancient geometric sage with a silver beard, an angular midnight-blue hood, a measured halo, and the f(x) insignia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14293d"/><stop offset="1" stop-color="#091724"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31607a"/><stop offset="1" stop-color="#152e45"/></linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#d8e2e0"/><stop offset="1" stop-color="#96b5c2"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3a5970" stroke-width=".7" opacity=".45"/></pattern>
  </defs>
  <rect width="320" height="320" rx="46" fill="url(#bg)"/>
  <rect width="320" height="320" rx="46" fill="url(#grid)" opacity=".55"/>
  <circle cx="160" cy="157" r="121" fill="none" stroke="#57798c" stroke-width="1.7" opacity=".65"/>
  <circle cx="160" cy="157" r="107" fill="none" stroke="#567386" stroke-dasharray="2 9" stroke-width="1.6" opacity=".6"/>
