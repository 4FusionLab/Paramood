  <path d="M47 309c6-36 25-58 67-66l46 26 46-26c41 9 62 30 67 66Z" fill="#19354d" stroke="#42647a" stroke-width="2.5"/>
  <path d="M91 154c0-59 28-103 69-111 42 8 69 52 69 111l-23 44-92 1Z" fill="#12283a" opacity=".67"/>
